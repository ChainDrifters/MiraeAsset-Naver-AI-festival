name: graph-ui-2

services:
  neo4j-2:
    image: neo4j:2026.06.0
    container_name: neo4j-2
    restart: unless-stopped
    init: true
    stop_grace_period: 60s

    # Optional host access.
    # Caddy and other containers on svc-net can access neo4j directly
    # without using these published ports.
    ports:
      - "${NEO4J_BIND_IP:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BIND_IP:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"

    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_server_default__advertised__address: "neo4j-2.yeongmin.net"
      NEO4J_server_bolt_advertised__address: "neo4j-2.yeongmin.net:443"
      NEO4J_dbms_security_procedures_unrestricted: "n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "n10s.*"
      NEO4J_server_unmanaged__extension__classes: "n10s.endpoint=/rdf"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - ./plugins:/plugins:ro

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell
          -u "$${NEO4J_AUTH%%/*}"
          -p "$${NEO4J_AUTH#*/}"
          "RETURN 1;" >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - svc-net-2

  neo4j-proxy-2:
    image: neo4j/helm-charts-reverse-proxy:2026.06.0
    container_name: neo4j-proxy-2
    restart: unless-stopped
    init: true

    depends_on:
      neo4j-2:
        condition: service_healthy

    # Nginx Proxy Manager terminates TLS and forwards HTTPS/WebSocket
    # traffic here. The proxy routes HTTP to 7474 and Bolt to 7687.
    ports:
      - "${NEO4J_PROXY_BIND_IP:-0.0.0.0}:${NEO4J_PROXY_PORT:-8443}:8443"

    environment:
      IP: "neo4j-2"
      # The Neo4j proxy subtracts 8000 when advertising the public port,
      # so internal port 8443 maps to external port 443.
      PORT: "8443"

    networks:
      - svc-net-2

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  openwebui_data:

networks:
  svc-net-2:
